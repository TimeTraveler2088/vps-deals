    }

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || (i18n.en[key] || key);
    }

    function applyI18n() {
      document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        const val = t(key);
        if (val.includes("<")) el.innerHTML = val;
        else el.textContent = val;
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
      });
      const brand = document.querySelector(".navbar-brand");
      if (brand) {
        brand.innerHTML = '<i class="bi bi-hdd-stack me-1"></i> ' + t("brand");
      }
      const langBtn = document.getElementById("langToggle");
      if (langBtn) langBtn.textContent = t("lang_btn");
      // Update "All Countries" option if still present
      const allOpt = document.querySelector('#countryFilter option[value="all"]');
      if (allOpt) allOpt.textContent = t("country_all");
      const backBtn = document.getElementById("backToTop");
      if (backBtn) {
        backBtn.title = t("back_top");
        backBtn.setAttribute("aria-label", t("back_top"));
      }
    }

    function getSectionConfig() {
      return {
        under25:  { id: "under25",  title: t("section_under25") },
        under30:  { id: "under30",  title: t("section_under30") },
        china:    { id: "china",    title: t("section_china") },
        storage:  { id: "storage",  title: t("section_storage") },
        tempsms:  { id: "tempsms",  title: t("section_tempsms") }
      };
    }

    // Tag display names (technical terms stay EN)
    const tagLabels = {
      kvm: "KVM",
      nvme: "NVMe",
      ssd: "SSD",
      dedicated: "Dedicated",
      storage: "Storage",
      "china-optimized": "China-Optimized",
      "temp sms": "Temp SMS"
    };

    let currentFilter = "all";
    let currentSearch = "";
    let currentCountry = "all";

    function createCard(deal) {
      const isTempSms = deal.section === "tempsms";
      const country = deal.country || "";
      const searchText = [
        deal.provider,
        deal.plan,
        deal.specs,
        deal.price,
        country,
        ...(deal.tags || [])
      ].join(" ").toLowerCase();

      const tagsHtml = (deal.tags || []).map(tg => {
        const label = tagLabels[tg] || tg;
        return `<span class="tag tag-${tg}">${label}</span>`;
      }).join("");

      const isFree = deal.isFree || deal.tags?.includes("free");
      const priceClass = isFree ? "price free" : "price";
      const btnClass = isFree ? "btn btn-outline-danger btn-buy" : "btn btn-primary btn-buy";
      const btnText = deal.buttonText || t("buy_now");

      if (isTempSms) {
        return `
          <div class="col-md-6 col-lg-4 col-xl-3 deal-item"
               data-tags="${(deal.tags || []).join(" ")}"
               data-country="${country.replace(/"/g, '&quot;')}"
               data-search="${searchText.replace(/"/g, '&quot;')}">
            <div class="card deal-card">
              <div class="card-header">
                ${deal.provider}
                <span class="provider-badge">${deal.plan || "Temp SMS"}</span>
              </div>
              <div class="card-body">
                <div class="mb-1">${tagsHtml}</div>
                <div class="specs">${deal.specs || ""}</div>
                <a href="${deal.link || "#"}" class="${btnClass}" target="_blank" rel="noopener">${btnText}</a>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="col-md-6 col-lg-4 col-xl-3 deal-item" 
             data-tags="${(deal.tags || []).join(" ")}"
             data-country="${country.replace(/"/g, '&quot;')}"
             data-search="${searchText.replace(/"/g, '&quot;')}">
          <div class="card deal-card">
            <div class="card-header">
              ${deal.provider}
              <span class="provider-badge">${deal.plan}</span>
            </div>
            <div class="card-body">
              <div class="mb-1">${tagsHtml}</div>
              <div class="specs">${deal.specs}</div>
              <div class="${priceClass}">${deal.price} <span class="period">${deal.period || ""}</span></div>
              <a href="${deal.link || "#"}" class="${btnClass}" target="_blank" rel="noopener">${btnText}</a>
            </div>
          </div>
        </div>
      `;
    }

    function renderDeals() {
      const sectionConfig = getSectionConfig();
      const groups = {};
      (typeof dealsData !== "undefined" ? dealsData : []).forEach(deal => {
        const key = deal.section || "under25";
        if (!groups[key]) groups[key] = [];
        groups[key].push(deal);
      });

      let isFirstSection = true;

      Object.keys(sectionConfig).forEach(key => {
        const container = document.getElementById(`section-${key}`);
        if (!container) return;

        const cfg = sectionConfig[key];
        const list = groups[key] || [];

        if (list.length === 0) {
          container.innerHTML = "";
          return;
        }

        const titleStyle = isFirstSection ? 'style="margin-top: 0.5rem;"' : '';
        isFirstSection = false;

        let html = `<h2 id="${cfg.id}" class="section-title" ${titleStyle}>${cfg.title}</h2>`;
        html += `<div class="row g-3 deal-grid">`;
        list.forEach(deal => { html += createCard(deal); });
        html += `</div>`;
        container.innerHTML = html;
      });

      applyFilters();
    }

    function applyFilters() {
      let visibleCount = 0;

      document.querySelectorAll(".deal-item").forEach(item => {
        const tags = item.dataset.tags || "";
        const searchText = item.dataset.search || "";
        const country = (item.dataset.country || "").toLowerCase();

        const matchFilter = currentFilter === "all" || tags.includes(currentFilter);
        const matchCountry = currentCountry === "all" || country.includes(currentCountry.toLowerCase());
        const matchSearch = !currentSearch || searchText.includes(currentSearch);

        if (matchFilter && matchCountry && matchSearch) {
          item.style.display = "";
          visibleCount++;
        } else {
          item.style.display = "none";
        }
      });

      let foundFirstVisible = false;
      document.querySelectorAll("[id^='section-']").forEach(section => {
        const items = section.querySelectorAll(".deal-item");
        let anyVisible = false;
        items.forEach(i => {
          if (i.style.display !== "none") anyVisible = true;
        });
        if (anyVisible) {
          section.style.display = "";
          const h2 = section.querySelector(".section-title");
          if (h2) {
            if (!foundFirstVisible) {
              h2.style.marginTop = "0.5rem";
              foundFirstVisible = true;
            } else {
              h2.style.marginTop = "2.5rem";
            }
          }
        } else {
          section.style.display = "none";
        }
      });

      document.getElementById("noResults").style.display = visibleCount === 0 ? "block" : "none";
    }

    function populateCountryFilter() {
      const select = document.getElementById("countryFilter");
      if (!select) return;

      // Keep first option, clear the rest
      while (select.options.length > 1) select.remove(1);

      const countries = new Set();
      (typeof dealsData !== "undefined" ? dealsData : []).forEach(deal => {
        if (deal.country) {
          deal.country.split(/[\/,]/).forEach(c => {
            const trimmed = c.trim();
            if (trimmed) countries.add(trimmed);
          });
        }
      });

      Array.from(countries).sort((a, b) => a.localeCompare(b)).forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });

      const allOpt = select.querySelector('option[value="all"]');
      if (allOpt) allOpt.textContent = t("country_all");
    }

    function setupControls() {
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          applyFilters();
        });
      });

      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", () => {
        currentSearch = searchInput.value.trim().toLowerCase();
        applyFilters();
      });

      const countrySelect = document.getElementById("countryFilter");
      if (countrySelect) {
        countrySelect.addEventListener("change", () => {
          currentCountry = countrySelect.value;
          applyFilters();
        });
      }

      const langBtn = document.getElementById("langToggle");
      if (langBtn) {
        langBtn.addEventListener("click", () => {
          currentLang = currentLang === "zh" ? "en" : "zh";
          localStorage.setItem("site_lang", currentLang);
          applyI18n();
          populateCountryFilter();
          renderDeals();
        });
      }
    }

    function setupTheme() {
      const toggle = document.getElementById("themeToggle");
      const icon = document.getElementById("themeIcon");
      const html = document.documentElement;

      const saved = localStorage.getItem("theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        html.setAttribute("data-theme", "dark");
        icon.className = "bi bi-sun-fill";
      }

      toggle.addEventListener("click", () => {
        const isDark = html.getAttribute("data-theme") === "dark";
        if (isDark) {
          html.removeAttribute("data-theme");
          icon.className = "bi bi-moon-stars-fill";
          localStorage.setItem("theme", "light");
        } else {
          html.setAttribute("data-theme", "dark");
          icon.className = "bi bi-sun-fill";
          localStorage.setItem("theme", "dark");
        }
      });
    }

    function setupBackToTop() {
      const btn = document.getElementById("backToTop");
      if (!btn) return;

      const toggle = () => {
        if (window.scrollY > 300) btn.classList.add("visible");
        else btn.classList.remove("visible");
      };

      window.addEventListener("scroll", toggle, { passive: true });
      toggle();

      btn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      currentLang = detectLang();
      applyI18n();
      populateCountryFilter();
      renderDeals();
      setupControls();
      setupTheme();
      setupBackToTop();
    });
  </script>

</body>
</html>
